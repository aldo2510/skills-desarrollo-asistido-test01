name: Step 4

on:
  push:
    paths:
      - "docs/debugging-notes.md"
      - "docs/pr-description.md"
      - "tests/**"
      - "app/**"
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: read

env:
  STEP_FILE: ".github/steps/5-step.md"

jobs:
  find_exercise:
    if: ${{ !github.event.repository.is_template }}
    name: Find Exercise Issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.1

  check_step_work:
    name: Validate debugging and Pull Request
    needs: [find_exercise]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f docs/debugging-notes.md
          test -f docs/pr-description.md
          test -f tests/test_empty_tasks.py
          grep -Eiq 'causa|root cause|reprodu' docs/debugging-notes.md
          test "$(gh pr list --base main --state open --json number --jq 'length')" -ge 1
          python -m pip install -r requirements.txt
          pytest -q

  post_next_step_content:
    name: Post Step 5
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.1
      - uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 5
      - uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_FILE }}
      - uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md
      - name: Enable Step 5
        run: |
          gh workflow disable "${{ github.workflow }}"
          gh workflow enable "Step 5"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
